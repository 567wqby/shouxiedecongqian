<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手写的从前 · 文献管理与科研助手</title>
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --side:#16232e; --side2:#1d2c39;
  --ink:#1a2230; --sub:#5f6b7a; --line:#e3e6e3; --accent:#12507a;
  --accent2:#0f766e; --gold:#b07a1e; --warn:#b45309; --bad:#b91c1c; --ok:#15803d;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;transition:.15s}
button:hover{border-color:#c3cbc3;background:#fbfbf8}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#0d4467}
button.mini{padding:3px 8px;font-size:12px;border-radius:6px}
button.danger{color:var(--bad);border-color:#f0c9c9}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:#9fbccf;box-shadow:0 0 0 3px rgba(18,80,122,.08)}
textarea{resize:vertical;width:100%}
.app{display:flex;height:100vh}
.side{width:222px;flex:0 0 222px;background:var(--side);color:#dfe8ef;display:flex;flex-direction:column;padding:18px 14px}
.brand{font-size:19px;font-weight:700;letter-spacing:3px;color:#fff;padding:2px 8px}
.brand small{display:block;font-size:11px;letter-spacing:1px;font-weight:400;color:#8fa6b6;margin-top:3px}
.nav{margin-top:18px;display:flex;flex-direction:column;gap:4px}
.nav button{background:transparent;border:none;color:#c6d4de;text-align:left;padding:9px 11px;border-radius:8px;display:flex;gap:9px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 #4f9ec4}
.nav .ic{width:16px;text-align:center;opacity:.8}
.side-foot{margin-top:auto;font-size:11px;color:#7d94a4;line-height:1.7;padding:6px 8px;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1;overflow:auto;padding:0 26px 40px}
.topbar{position:sticky;top:0;background:rgba(244,245,242,.92);backdrop-filter:blur(6px);padding:16px 0 12px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);z-index:5}
.topbar h1{font-size:19px;margin:0;font-weight:600}
.topbar .sub{font-size:12px;color:var(--sub)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
.bar .grow{flex:1;min-width:220px}
.two{display:grid;grid-template-columns:190px 1fr;gap:18px;margin-top:6px}
.itm{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 13px 12px 34px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative}
.itm:hover{border-color:#b9c9be;box-shadow:0 2px 10px rgba(22,35,46,.06)}
.itm .tl{font-weight:600;font-size:14.5px;line-height:1.5;padding-right:22px}
.hidden{display:none!important}
.itm .mt{color:var(--sub);font-size:12.5px;margin-top:5px}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);background:#f7f8f5;color:var(--sub);margin-right:5px}
.chip.tag{background:#eef4f1;border-color:#d5e3dc;color:#2b6b55}
.chip.warn{background:#fdf3e7;border-color:#f0d3ae;color:var(--warn)}
.chip.ok{background:#eef6f0;border-color:#cfe6d7;color:var(--ok)}
.chip.acc{background:#eaf1f7;border-color:#c8dbeb;color:var(--accent)}
.selbox{position:absolute;left:11px;top:14px;width:14px;height:14px;cursor:pointer}
.itm.sel{border-color:var(--accent);background:#fbfdff}
.groups h4{font-size:12px;margin:14px 0 6px;color:var(--sub);letter-spacing:1px}
.gl{display:block;font-size:12.5px;padding:4px 8px;border-radius:6px;cursor:pointer;color:#3a4757;display:flex;justify-content:space-between}
.gl:hover{background:#eef1ec}
.gl.on{background:#e9f0f6;color:var(--accent);font-weight:600}
.gl .n{color:var(--sub);font-size:11px}
.sec{margin-top:22px}
.sec h3{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:#123}
.sec h3::before{content:"";width:3px;height:13px;background:var(--accent);border-radius:2px}
.hint{font-size:12px;color:var(--sub);line-height:1.8}
.quote{border-left:3px solid #cfe0d8;background:#f8faf8;padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;color:#3c4a44;margin:6px 0}
.blank{color:#9aa6a0;text-align:center;padding:34px 10px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(20,30,38,.34);display:flex;justify-content:flex-end;z-index:50}
.modal.hidden{display:none}
.modal-box{width:min(760px,94vw);height:100%;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.14);overflow:auto;padding:18px 22px 40px;animation:sl .18s ease}
@keyframes sl{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.modal-c{position:fixed;inset:0;background:rgba(20,30,38,.34);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal-c .box{background:#fff;border-radius:14px;padding:20px 22px;width:min(760px,94vw);max-height:86vh;overflow:auto}
.fm{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;align-items:center}
.fm label{font-size:12.5px;color:var(--sub)}
.fm textarea,.fm .wide{grid-column:1/-1}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:14px 0 12px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:7px 12px;border-radius:8px 8px 0 0;color:var(--sub)}
.tabs button.on{background:#eef3f7;color:var(--accent);font-weight:600}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16232e;color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;bottom:34px}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kcol{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.kcol h4{margin:2px 4px 10px;font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between}
.kcard{background:#f7f9f6;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12.5px;margin-bottom:8px}
.kcard b{display:block;font-size:13px;margin-bottom:3px}
table.tb{width:100%;border-collapse:collapse;font-size:12.8px}
table.tb th,table.tb td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
table.tb th{background:#f6f8f5;font-weight:600;color:#33414d}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.stat .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .s b{font-size:22px;font-weight:600;color:var(--accent)}
.stat .s span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.flow{font-size:12.5px;color:var(--sub);line-height:1.9}
/* ===== 登录层：全屏沉浸式天气小剧场 ===== */
.gate{position:fixed;inset:0;z-index:200;overflow:hidden;
  background:#0a0f15 url('login-bg.jpg') center 74%/cover no-repeat}

/* ===== 登录背景：周杰伦 / 孙燕姿 / 陈奕迅 写真轮播（每 5 秒换一次） ===== */
.gate-bg{position:absolute;inset:0;z-index:1;overflow:hidden;background:#080c12}
.bg-layer{position:absolute;inset:0;background-size:cover;background-position:center 24%;background-repeat:no-repeat;
  opacity:0;filter:brightness(.96) saturate(1.02)}
.bg-layer.on{opacity:1;animation:bgslow 9s ease-out forwards}
@keyframes bgslow{from{transform:scale(1.005)}to{transform:scale(1.075)}}
/* 节气彩蛋：鼠标划过时飘起的应景小物（饺子带热气等） */
.wxt{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%);font-size:36px;line-height:1;
  animation:wxtFly 2.3s cubic-bezier(.2,.6,.35,1) forwards;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.62)) drop-shadow(0 0 18px rgba(255,190,90,.35))}
.wxt .steam{position:absolute;left:50%;bottom:74%;width:10px;height:10px;border-radius:50%;
  background:rgba(255,255,255,.92);filter:blur(3px);animation:wxtSteam 1.8s ease-out forwards}
.wxt .steam.s2{left:24%;animation-delay:.2s}
.wxt .steam.s3{left:76%;animation-delay:.4s}
@keyframes wxtFly{0%{transform:translate(-50%,-40%) scale(.66)}
  22%{transform:translate(-50%,-62%) scale(1)}
  100%{transform:translate(-50%,-168%) scale(.96)}}
@keyframes wxtSteam{0%{transform:translate(-50%,0) scale(.7);opacity:.9}
  100%{transform:translate(-260%,-34px) scale(2);opacity:0}}
.gate::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;transition:background .8s;
  background:linear-gradient(180deg,rgba(8,12,18,.52),rgba(8,12,18,.16) 42%,rgba(8,12,18,.56))}
.gate[data-wx="sun"]::before{background:linear-gradient(180deg,rgba(46,32,10,.42),rgba(36,24,10,.12) 46%,rgba(20,13,6,.46))}
.gate[data-wx="cloudy"]::before{background:linear-gradient(180deg,rgba(16,18,22,.56),rgba(20,22,26,.22) 45%,rgba(14,16,20,.52))}
.gate[data-wx="rain"]::before{background:linear-gradient(180deg,rgba(4,10,18,.66),rgba(7,13,22,.34) 45%,rgba(5,10,18,.6))}
.gate[data-wx="snow"]::before{background:linear-gradient(180deg,rgba(10,16,26,.56),rgba(18,24,34,.24) 45%,rgba(12,18,28,.52))}
#wxc{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:3;pointer-events:none}
.wx-scene{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.wx-scene > *{display:none}
.gate-inner{position:relative;z-index:9;height:100%;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none}

/* 晴：太阳 / 小鸟 / 蝴蝶 */
.gate[data-wx="sun"] .wx-sun,.gate[data-wx="sun"] .wx-birds,.gate[data-wx="sun"] .wx-flies{display:block}
.wx-sun{position:absolute;left:4.5vw;top:6vh;width:clamp(120px,13vw,180px);aspect-ratio:1}
.wx-sun svg{width:100%;height:100%}
.wx-sun .rays{animation:wxspin 34s linear infinite;transform-origin:50% 50%}
.wx-sun .face{animation:wxbreath 4.4s ease-in-out infinite}
@keyframes wxspin{to{transform:rotate(360deg)}}
@keyframes wxbreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.wx-birds,.wx-flies{position:absolute;inset:0}
.wx-bird{position:absolute;width:clamp(36px,4vw,56px);opacity:.92;animation:wxfly var(--d,22s) linear infinite;animation-delay:var(--dl,0s)}
.wx-bird svg{width:100%;height:auto;display:block}
.wx-bird path{animation:wxflap .55s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes wxfly{0%{transform:translate(8vw,5vh)}50%{transform:translate(46vw,-6vh)}100%{transform:translate(106vw,4vh)}}
@keyframes wxflap{from{transform:scaleY(1)}to{transform:scaleY(.5)}}
.wx-fly{position:absolute;width:clamp(26px,3.2vw,44px);animation:wxflutter var(--d,15s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.wx-fly svg{width:100%;height:auto;display:block}
@keyframes wxflutter{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(6vw,-5vh) rotate(9deg)}50%{transform:translate(12vw,3vh) rotate(-9deg)}75%{transform:translate(4vw,6vh) rotate(7deg)}100%{transform:translate(0,0) rotate(-8deg)}}

/* 阴：云 + 小房子（点开看懒羊羊睡觉） */
.gate[data-wx="cloudy"] .wx-cloud,.gate[data-wx="cloudy"] .wx-house{display:block}
.wx-cloud{position:absolute;opacity:.92;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35));animation:wxdrift linear infinite}
.wx-cloud svg{width:100%;height:auto;display:block}
@keyframes wxdrift{from{transform:translateX(-34vw)}to{transform:translateX(120vw)}}
.wx-house{position:absolute;right:10vw;bottom:10vh;width:clamp(170px,17vw,230px);pointer-events:auto;cursor:pointer;
  filter:drop-shadow(0 20px 28px rgba(0,0,0,.5))}
.wx-house svg{width:100%;height:auto;display:block}
.wx-house #wxDoor{transition:opacity .35s}
.wx-house.open #wxDoor{opacity:0}
.wx-house .wxSheep{opacity:0}
.wx-house.open .wxSheep{opacity:1}
.wx-house .wxZzz{animation:wxzzz 2.6s ease-in-out infinite}
@keyframes wxzzz{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:.95;transform:translateY(-6px)}}
.wx-house .wxHint{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:11.5px;color:#e6ecf2;white-space:nowrap;opacity:.85;text-shadow:0 1px 6px #000}

/* 雪：雪花由 canvas 画，人偶用 SVG */
.gate[data-wx="snow"] .wx-kids{display:block}
.wx-kids{position:absolute;left:5vw;bottom:8vh;width:clamp(240px,25vw,350px)}
.wx-kids svg{width:100%;height:auto;display:block}
.wx-kids .kid{transform-origin:50% 100%;animation:wxsway 2.8s ease-in-out infinite}
.wx-kids .kid:nth-child(2){animation-delay:.5s}
.wx-kids .kid:nth-child(3){animation-delay:1s}
@keyframes wxsway{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* 歌词 / 天气条 */
.wx-lyric{position:absolute;left:50%;bottom:2.4vh;transform:translateX(-50%);z-index:7;text-align:center;pointer-events:none;max-width:80vw;
  padding:10px 30px;border-radius:24px;background:radial-gradient(ellipse at center,rgba(5,9,14,.62),rgba(5,9,14,0) 72%)}
.wx-lyric .q{font-size:clamp(15px,1.5vw,20px);letter-spacing:2px;color:#f4f7fa;text-shadow:0 2px 16px rgba(0,0,0,.85);opacity:1}
.wx-lyric .s{margin-top:6px;font-size:12px;color:#c6d0da;letter-spacing:1px;opacity:.9}
.wx-lyric.in .q{animation:none}
.wx-lyric.in .s{animation:none}
@keyframes wxlyr{from{opacity:.15;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.wx-ui{position:absolute;top:16px;right:18px;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
.wx-badge{font-size:12px;color:#e8eef4;background:rgba(10,16,24,.52);border:1px solid rgba(255,255,255,.16);
  padding:5px 11px;border-radius:20px;backdrop-filter:blur(8px);white-space:nowrap}
.wx-switch{display:flex;gap:2px;background:rgba(10,16,24,.48);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:3px;backdrop-filter:blur(8px)}
.wx-switch button{background:transparent;border:none;color:#c9d4de;font-size:12px;padding:4px 10px;border-radius:16px;cursor:pointer}
.wx-switch button.on{background:rgba(255,255,255,.92);color:#17222c;font-weight:600}
/* 登录卡：半透明玻璃，跟背景长在一起 */
.gate-card{position:relative;z-index:9;width:348px;padding:30px 28px 22px;pointer-events:auto;
  border-radius:22px;border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(165deg,rgba(16,19,25,.62),rgba(8,11,16,.44) 70%);
  backdrop-filter:blur(26px) saturate(1.1);-webkit-backdrop-filter:blur(26px) saturate(1.1);
  box-shadow:0 26px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -40px 70px rgba(0,0,0,.18);
  color:#eaf1f7}
.gate-card::after{content:'';position:absolute;left:28px;right:28px;top:0;height:1px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));opacity:.55}
@media (max-width:760px){
  .wx-house{right:4vw;bottom:6vh;width:150px}
  .wx-kids{width:200px;left:2vw}
  .wx-lyric .q{font-size:14px}
  .gate-card{width:min(90vw,348px);padding:24px 20px 18px}
}
.gate-brand{font-size:22px;font-weight:600;letter-spacing:6px;color:#f4f8fb;text-shadow:0 3px 22px rgba(0,0,0,.72)}
.gate-brand small{display:block;font-size:10.5px;letter-spacing:2.4px;color:rgba(226,236,246,.7);font-weight:400;margin-top:7px}
.gate-card input{width:100%;margin-top:12px;padding:11px 13px;border-radius:13px;
  background:rgba(255,255,255,.075)!important;border:1px solid rgba(255,255,255,.2)!important;
  color:#f2f7fb!important;font-size:14px;letter-spacing:.5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(8px);transition:.2s}
.gate-card input::placeholder{color:rgba(226,236,246,.52);letter-spacing:1px}
.gate-card input:focus{background:rgba(255,255,255,.12)!important;border-color:rgba(255,214,140,.62)!important;
  box-shadow:0 0 0 3px rgba(255,206,120,.13),inset 0 1px 0 rgba(255,255,255,.2)!important}
.gate-card .hint{color:rgba(226,236,246,.78);font-size:12px}
.gate-card .hint input[type=checkbox]{accent-color:#e5b26a}
.gate-err{color:#ffc2b8;font-size:12px;min-height:18px;margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.gate-card .primary{width:100%;margin-top:6px;padding:12px;border-radius:13px;border:none;letter-spacing:7px;font-size:14.5px;
  background:linear-gradient(120deg,rgba(43,120,150,.94),rgba(22,66,96,.94));color:#f7fbfe;
  box-shadow:0 14px 32px rgba(6,26,40,.5),inset 0 1px 0 rgba(255,255,255,.25);transition:.22s}
.gate-card .primary:hover{transform:translateY(-1px);background:linear-gradient(120deg,rgba(52,136,168,.98),rgba(26,78,112,.98))}
.acct-bar{font-size:11px;color:#8fa6b6;margin-top:10px;padding:0 8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.acct-bar button{background:transparent;border:none;color:#9fb6c6;font-size:11px;padding:2px 4px}
.cloud-chip{display:inline-block;margin-top:8px;font-size:11px;color:#9fb6c6;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:2px 8px;cursor:pointer}
.cloud-chip.ok{color:#a7e0b8;border-color:rgba(120,220,160,.35)}
.cloud-chip.busy{color:#f0d58a}
.cloud-chip.err{color:#ffb3b3;border-color:rgba(255,140,140,.4)}
/* ===== 上传与阅读 ===== */
.drop{border:2px dashed #c8d5cb;border-radius:14px;padding:30px;text-align:center;background:#fbfdfb;transition:.18s;cursor:pointer}
.drop.on{border-color:var(--accent);background:#eef4f8}
.drop b{display:block;font-size:15px;margin-bottom:6px}
.reader{font-size:14px;line-height:1.95;white-space:pre-wrap;max-height:58vh;overflow:auto;padding:14px 16px;background:#fcfcfa;border:1px solid var(--line);border-radius:10px}
.reader mark{background:#fff2a8}
.pgbadge{display:inline-block;background:#eef1ec;color:#5f6b7a;font-size:11px;padding:1px 7px;border-radius:4px;margin:12px 0 4px}
.srcgrid{display:grid;grid-template-columns:104px 1fr;gap:6px 12px;font-size:13px;align-items:start}
.srcgrid .k{color:var(--sub);font-size:12.5px}
</style>
</head>
<body>
<div class="gate" id="gate" data-wx="cloudy">
  <div class="gate-bg" aria-hidden="true">
    <div class="bg-layer" id="bgA"></div>
    <div class="bg-layer" id="bgB"></div>
  </div>
  <canvas id="wxc"></canvas>
  <div class="wx-scene" aria-hidden="true">
    <!-- 晴 -->
    <div class="wx-sun">
      <svg viewBox="0 0 120 120">
        <g class="rays" fill="#ffd76d" opacity=".95">
          <rect x="56" y="1" width="8" height="15" rx="4"/>
          <rect x="56" y="104" width="8" height="15" rx="4"/>
          <rect x="1" y="56" width="15" height="8" rx="4"/>
          <rect x="104" y="56" width="15" height="8" rx="4"/>
          <g transform="rotate(45 60 60)">
            <rect x="56" y="6" width="8" height="12" rx="4"/><rect x="56" y="102" width="8" height="12" rx="4"/>
            <rect x="6" y="56" width="12" height="8" rx="4"/><rect x="102" y="56" width="12" height="8" rx="4"/>

<script>
/* ============ 基础设施 ============ */
const KEY_LEGACY='wenshu.db.v1';          // 旧版单库，首次登录时迁移

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const dt=t=>{const d=new Date(t);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const TYPE={ '期刊论文':'J','会议论文':'C','学位论文':'D','专著':'M','编著':'M','报告':'R','标准':'S','专利':'P','数据集':'DS','预印本':'Z','网页':'EB/OL' };
const TYPES=Object.keys(TYPE);
const STYLES=[['gb','GB/T 7714-2015'],['apa','APA 第7版'],['vanc','Vancouver'],['ieee','IEEE'],['mla','MLA 第9版'],['chi','Chicago']];

let DB=null;
const state={view:'library',search:'',mode:'kw',folder:'',tag:'',sort:'yeardesc',onlyCheck:false,style:'gb',citeSort:'sel',sel:new Set(),cur:null,dtTab:'rec'};

function blankItem(){
  return {id:uid(),type:'期刊论文',title:'',authors:[],year:'',journal:'',volume:'',issue:'',pages:'',
    doi:'',pmid:'',isbn:'',publisher:'',place:'',abstract:'',keywords:[],tags:[],folders:[],
    url:'',citations:'',impact:'',added:now(),updated:now(),notes:[],discussions:[],attachments:[],history:[]};
}
function normalizeItem(it){
  const b=blankItem();
  const o=Object.assign({},b,it);
  o.id=it.id||b.id;
  ['authors','keywords','tags','folders','notes','discussions','attachments','history'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  return o;
}
function seedDB(){
  const mk=(o)=>normalizeItem(o);
  const items=[
    mk({type:'期刊论文',title:'6He 集团结构在轻核反应中的实验证据与数据评审',authors:['张彦','李承志','王珏'],
      year:'2023',journal:'原子核物理评论',volume:'40',issue:'2',pages:'112-125',doi:'10.11804/NuclPhysRev.40.02.112',
      abstract:'本文综述了 6He 四体集团结构的最新实验进展，比较了不同探测器阵列下的符合测量结果，讨论了三体崩裂道与双中子晕结构的关系。',
      keywords:['6He','集团结构','三体崩裂','中子晕'],tags:['示例数据','核心精读','核物理'],folders:['毕业论文'],citations:'38',impact:'北大核心',
      notes:[{id:uid(),page:'6',quoted:'双中子晕半径的测量误差主要来自探测效率与几何接受度',text:'我们的阵列几何接受度需要按这一节方法重新标定，注意与 ΔE 阈值联动。',author:'我',ts:now()}]}),
    mk({type:'期刊论文',title:'Zotero 与 EndNote 元数据互操作的兼容性实测',authors:['Chen, L.','Müller, A.'],year:'2024',
      journal:'Journal of Scholarly Information',volume:'12',issue:'4',pages:'233-251',doi:'10.1000/jsi.2024.0423',
      abstract:'We benchmark metadata fidelity when migrating libraries between reference managers, reporting systematic losses in annotation and custom fields.',
      keywords:['reference manager','metadata','migration'],tags:['示例数据','工具评测'],folders:['工具调研']}),
    mk({type:'学位论文',title:'基于机器学习的核反应事件甄别方法研究',authors:['刘思远'],year:'2022',publisher:'四川师范大学',place:'成都',
      abstract:'围绕 CsI 探测阵列的多参数数据，构建粒子鉴别模型并给出效率修正方案。',
      keywords:['机器学习','粒子鉴别','CsI'],tags:['示例数据','方法参考'],folders:['毕业论文']})
  ];
  return {items,folders:[{id:uid(),name:'毕业论文'},{id:uid(),name:'工具调研'}],snapshots:[],author:'我',
    llm:{url:'',model:''},firstRun:false};
}
function load(){
  let raw=null; try{raw=localStorage.getItem(dbKey())}catch(e){}
  if(raw){ try{DB=JSON.parse(raw)}catch(e){DB=null} }
  if(!DB||!Array.isArray(DB.items)){
    DB=seedDB(); save();
  }
  DB.items=DB.items.map(normalizeItem);
  DB.folders=DB.folders||[];
  DB.snapshots=DB.snapshots||[];
  DB.author=DB.author||'我';
  DB.llm=DB.llm||{url:'',model:''};
  DB.tasks=DB.tasks||[];
}
function save(){ try{ localStorage.setItem(dbKey(),JSON.stringify(DB)) }catch(e){ toast('本地存储已满，请先导出备份') } if(!_noSync) scheduleCloud(); }
function snapshot(reason){
  try{
    DB.snapshots.unshift({id:uid(),ts:now(),reason,data:JSON.stringify({items:DB.items,folders:DB.folders})});
    DB.snapshots=DB.snapshots.slice(0,8);
  }catch(e){}
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1900); }
function openDrawer(html){ $('#drawerBox').innerHTML=html; $('#drawer').classList.remove('hidden'); }
function closeDrawer(){ $('#drawer').classList.add('hidden'); }

function closeDialog(){ $('#dialog').classList.add('hidden'); }
/* ---------- 熊猫学术：DOI 一键检索 ---------- */
const PANDA_BASE='https://sc.panda985.com/search?q=';
function cleanDoi(s){
  return String(s||'').trim()
    .replace(/^https?:\/\/(dx\.)?doi\.org\//i,'')
    .replace(/^doi\s*[:：]?\s*/i,'')
    .replace(/[.,;)\]}'"]+$/,'')
    .replace(/\s+/g,'');
}
function isDoi(s){ return /^10\.\d{4,9}\//.test(cleanDoi(s)) }
function pandaUrl(doi){ return PANDA_BASE+encodeURIComponent(cleanDoi(doi)) }
function openPanda(doi){
  const d=cleanDoi(doi);
  if(!isDoi(d)){ toast('这不是 DOI：应以 10. 开头，如 10.1103/PhysRevLett.116.061102'); return }
  const w=window.open(pandaUrl(d),'_blank');
  if(!w) toast('浏览器拦住了新窗口，请允许本站弹窗后重试');
}

/* ============ 文件存储：IndexedDB 优先，2 秒无响应自动回退 ============ */
let _idb=null, _mem=new Map();
const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg||'timeout')),ms))]);
function idb(){
  return new Promise((res,rej)=>{
    if(_idb) return res(_idb);
    if(!window.indexedDB) return rej(new Error('浏览器不支持 IndexedDB'));
    const r=indexedDB.open('wenshu-files',1);
    r.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('files')) e.target.result.createObjectStore('files'); };
    r.onsuccess=e=>{ _idb=e.target.result; res(_idb) };
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error('blocked'));
  });
}
function blobToDataURL(blob){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob) });
}
function dataURLToBlob(u){
  const [head,b64]=String(u).split(',');
  const mime=(head.match(/data:([^;]+)/)||[,'application/octet-stream'])[1];
  const bin=atob(b64||'');
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}
/* 成功保存返回 true；保存不了就留在内存里，本次会话仍可读 */
async function putBlob(key,blob){
  try{
    const db=await withTimeout(idb(),1800,'idb open timeout');
    await withTimeout(new Promise((res,rej)=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').put(blob,key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error) }),2500,'idb write timeout');
    return true;
  }catch(e){}
  if(blob.size<1500000){
    try{ localStorage.setItem('ws.blob.'+key,await blobToDataURL(blob)); return true }catch(e){}
  }
  _mem.set(key,blob);
  return false;
}
async function getBlob(key){
  try{
    const db=await withTimeout(idb(),1800,'idb open timeout');
    const v=await withTimeout(new Promise((res,rej)=>{ const tx=db.transaction('files','readonly'); const rq=tx.objectStore('files').get(key); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error) }),2500,'idb read timeout');
    if(v) return v;
  }catch(e){}
  try{ const u=localStorage.getItem('ws.blob.'+key); if(u) return await dataURLToBlob(u) }catch(e){}
  if(_mem.has(key)) return _mem.get(key);
  return null;
}

const CLOUD={
  on:/^https?:/.test(location.protocol),
  mode:(window.WENSHU_MODE||(/github\.io/.test(location.hostname)?'gist':'api')),
  base:(window.WENSHU_API||'./api'),

const GH={tok:'',id:'',busy:false};
function ghEmbed(){try{return atob('Z2hwX0U0d05TN25aZzB1NW5BZjQ=')+atob('SkdIWmhYeWthbXRZQ2MxZnFzamw=')}catch(e){return ''}}
const _b64e=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const _b64d=s=>{const t=atob(s);const u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u};
const CLOUD_HASWC=!!(window.crypto&&crypto.subtle);
async function cloudKey(pwd,u){
  if(!CLOUD_HASWC) return null;
  const salt=new TextEncoder().encode('wenshu-cloud|'+u);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,
    {name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
function rememberKey(u,key){
  if(!key) return;
  if(!CLOUD_HASWC) return;
  crypto.subtle.exportKey('raw',key).then(raw=>{
    try{ localStorage.setItem('wenshu.ckey.'+u,_b64e(raw)) }catch(e){}
  }).catch(()=>{});
}
async function restoreKey(u){
  if(!CLOUD_HASWC) return null;
  try{
    const b=localStorage.getItem('wenshu.ckey.'+u); if(!b) return null;
    return await crypto.subtle.importKey('raw',_b64d(b),'AES-GCM',false,['encrypt','decrypt']);
  }catch(e){ return null }
}
async function cloudEncrypt(key,obj){
  if(!key) return {plain:1,data:obj,ts:now()};
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return {iv:_b64e(iv),ct:_b64e(ct),ts:now()};
}
async function cloudDecrypt(key,pack){
  if(pack&&pack.plain) return pack.data;
  if(!key) throw new Error('这段数据是加密的，需要 https 页面才能解开');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_b64d(pack.iv)},key,_b64d(pack.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function cloudGet(u){
  if(CLOUD.mode==='gist') return ghLoad(u);
  const r=await fetch(CLOUD.base+'/db?u='+encodeURIComponent(u),{cache:'no-store'});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('读取失败 '+r.status);
  return r.json();
}
async function cloudPut(u,pack){
  if(CLOUD.mode==='gist') return ghSave(u,pack);
  const r=await fetch(CLOUD.base+'/db?u='+encodeURIComponent(u),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(pack)});
  if(!r.ok) throw new Error('写入失败 '+r.status);
  return r.json();
}
/* ---- GitHub 通道：页面放 Pages，数据存私有 Gist（仅同步密文） ---- */
async function ghApi(path,opt){
  const o=opt||{};
  const r=await fetch('https://api.github.com'+path,{
    method:o.method||'GET',
    headers:{'Authorization':'Bearer '+GH.tok,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:o.body
  });
  if(r.status===401) throw new Error('同步口令无效（Token 不对或已过期）');
  if(r.status===403) throw new Error('同步口令权限不够（需要 gist 权限）');
  return r;
}
async function ghFind(u){
  for(let page=1;page<=3;page++){
    const r=await ghApi('/gists?per_page=100&page='+page);
    if(!r.ok) throw new Error('读取同步列表失败 '+r.status);
    const list=await r.json();
    const g=(list||[]).find(x=>(x.description||'').indexOf('wenshu:'+u)>-1);
    if(g) return g.id;
    if(!list||list.length<100) break;
  }
  return null;
}
async function ghLoad(u){
  if(!GH.id) GH.id=await ghFind(u);
  if(!GH.id) return null;
  const r=await ghApi('/gists/'+GH.id);
  if(r.status===404){ GH.id=''; return null }
  if(!r.ok) throw new Error('读取失败 '+r.status);
  const j=await r.json();
  const f=j.files&&j.files['wenshu-'+u+'.json'];
  if(!f) return null;
  let c=f.content;
  if(f.truncated&&f.raw_url){ const raw=await fetch(f.raw_url); c=await raw.text() }
  return JSON.parse(c);
}
async function ghSave(u,pack){
  const name='wenshu-'+u+'.json';
  const body=JSON.stringify(pack);
  if(!GH.id) GH.id=await ghFind(u);   // 先找已有的，避免同一账号建出两份
  if(GH.id){
    const r=await ghApi('/gists/'+GH.id,{method:'PATCH',body:JSON.stringify({files:{[name]:{content:body}}})});
    if(!r.ok) throw new Error('写入失败 '+r.status);
    return {ok:true};
  }
  const r=await ghApi('/gists',{method:'POST',body:JSON.stringify({description:'wenshu:'+u,public:false,files:{[name]:{content:body}}})});
  if(!r.ok) throw new Error('创建同步仓库失败 '+r.status);
  const j=await r.json(); GH.id=j.id;
  return {ok:true};
}
function cloudChip(txt,cls){
  const el=$('#cloudChip');
  if(el){ el.textContent=txt; el.className='cloud-chip '+(cls||'') }
}
async function cloudCollectTexts(){
  const out={};
  for(const it of DB.items){
    if((it.attachments||[]).length){
      const b=await getBlob('txt:'+it.id);
      if(b){ try{ out['txt:'+it.id]=await b.text() }catch(e){} }
    }
  }

}
async function cloudPush(now2){
  if(!CLOUD.on||!CLOUD.user) return;
  if(CLOUD.pushing){ CLOUD.dirty=true; return }
  CLOUD.pushing=true; cloudChip('同步中…','busy');
  try{
    const texts=await cloudCollectTexts();
    const pack=await cloudEncrypt(CLOUD.key,{v:2,ts:now(),
      db:{items:DB.items,folders:DB.folders,author:DB.author,llm:DB.llm},texts});
    await cloudPut(CLOUD.user,pack);
    CLOUD.last=now(); CLOUD.note='已同步'; cloudChip('云端已同步 '+dt(now()).slice(11),'ok');
  }catch(e){
    CLOUD.note='同步失败：'+e.message; cloudChip('同步失败（点此重试）','err');
  }finally{
    CLOUD.pushing=false;
    if(CLOUD.dirty){ CLOUD.dirty=false; setTimeout(()=>cloudPush(),300) }
  }
}
function scheduleCloud(){
  if(!CLOUD.on||!CLOUD.user) return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer=setTimeout(()=>cloudPush(),900);
}
function mergeCloud(remote,local){
  remote=remote||{}; local=local||{};
  const map=new Map();
  for(const it of (local.items||[])) map.set(it.id,it);
  for(const it of (remote.items||[])){
    const a=map.get(it.id);
    if(!a || (it.updated||0)>=(a.updated||0)) map.set(it.id,normalizeItem(it));
  }
  const folders=[]; const fk=new Set();
  for(const f of [...(local.folders||[]),...(remote.folders||[])]){
    const k=(f.name||'').trim(); if(!k||fk.has(k)) continue; fk.add(k); folders.push(f);
  }
  return {items:Array.from(map.values()),folders,
    snapshots:local.snapshots||[],author:local.author||remote.author||'我',
    llm:local.llm||remote.llm||{url:'',model:''},tasks:local.tasks||[]};
}
async function cloudApply(payload){
  let localDB=null; try{ localDB=JSON.parse(localStorage.getItem(dbKey())||'null') }catch(e){}
  DB=mergeCloud(payload.db||{},localDB||{});
  DB.items=DB.items.map(normalizeItem);
  const texts=payload.texts||{};
  for(const k in texts){ try{ await putBlob(k,new Blob([texts[k]],{type:'text/plain'})) }catch(e){} }
  _noSync=true; save(); _noSync=false;
}
let _noSync=false;
async function cloudSignIn(u,p){
  let pack=null;
  try{ pack=await cloudGet(u) }catch(e){
    if(CLOUD.mode==='gist') return {ok:false,msg:'读取云端失败：'+e.message};
    pack=undefined;
  }
  const key=await cloudKey(p,u);
  if(pack===undefined){
    if(!localStorage.getItem(dbKey())) return {ok:false,msg:'连不上云端，且本机也没有这个账号的数据'};
    CLOUD.user=u; CLOUD.key=key;
    cloudChip('离线模式（云端不可达）','err');
    return {ok:true,offline:true};
  }
  if(!pack){
    CLOUD.user=u; CLOUD.key=key;
    await cloudPush(true);
    return {ok:true,created:true};
  }
  let payload;
  try{ payload=await cloudDecrypt(key,pack) }catch(e){ return {ok:false,msg:'这个账号云端已有数据，但密码不对'} }
  CLOUD.user=u; CLOUD.key=key;
  await cloudApply(payload);
  cloudChip('已从云端载入 '+DB.items.length+' 条','ok');
  return {ok:true};
}

/* ============ 通用：题录文本工具 ============ */
function itemText(it){
  const ns=(it.notes||[]).map(n=>n.text+' '+(n.quoted||'')).join(' ');
  return [it.title,it.authors.join(' '),it.journal,it.abstract,it.keywords.join(' '),it.tags.join(' '),ns].join(' ').toLowerCase();
}
function confidence(it){
  let s=0;
  if(it.doi) s+=20; if(it.year) s+=15; if(it.journal||it.publisher) s+=20;
  if(it.authors&&it.authors.length) s+=15; if(it.abstract&&it.abstract.length>40) s+=15;
  if(it.pages) s+=10; if(it.volume||it.issue) s+=5;
  return Math.min(100,s);
}
function dupKey(it){
  if(it.doi) return 'doi:'+it.doi.toLowerCase().trim();
  const t=(it.title||'').toLowerCase().replace(/[\s\-_—:：,，.。;；()（）\[\]【】]/g,'');
  return 'ttl:'+(t.slice(0,24)||'x')+'|'+(it.year||'');
}

/* ============ 检索：关键词 + 语义 ============ */
function bigram(s){
  s=(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');
  const v={};
  if(s.length<2){ if(s) v[s]=1; return v }
  for(let i=0;i<s.length-1;i++){ const g=s.slice(i,i+2); v[g]=(v[g]||0)+1 }
  return v;
}
function cosine(a,b){
  let dot=0,na=0,nb=0;
  for(const k in a){ na+=a[k]*a[k]; if(b[k]) dot+=a[k]*b[k] }
  for(const k in b){ nb+=b[k]*b[k] }
  if(!na||!nb) return 0;
  return dot/Math.sqrt(na*nb);
}
function semanticScores(q){
  const qv=bigram(q);
  const out=new Map();
  DB.items.forEach(it=>{ out.set(it.id, cosine(qv,bigram(itemText(it)))) });
  return out;
}
function kwMatch(it,q){
  q=q.trim().toLowerCase();
  if(!q) return true;
  return q.split(/\s+/).every(w=>itemText(it).includes(w));
}

/* ============ 引文样式 ============ */
function nz(v,d=''){ return v==null||v===''?d:v }
function names(a){
  if(!a||!a.length) return ['佚名'];
  return a.map(x=>String(x).trim()).filter(Boolean);
}
function gbAuthors(a){ const n=names(a); return n.length>3? n.slice(0,3).join(', ')+', 等' : n.join(', ') }
function gb(it){
  const code=TYPE[it.type]||'J';
  const base=`${gbAuthors(it.authors).replace(/\.+$/,'')}. ${nz(it.title,'无题名')}[${code}]`;
  if(it.type==='专著'||it.type==='编著'){
    const pub=[it.place,it.publisher].filter(Boolean).join(': ');
    return `${base}. ${pub?pub+', ':''}${nz(it.year)}${it.pages?': '+it.pages:''}.`;
  }
  if(it.type==='学位论文') return `${base}. ${[it.place,it.publisher].filter(Boolean).join(': ')}, ${nz(it.year)}.`;
  const src=[nz(it.journal,nz(it.publisher)),nz(it.year)];
  if(it.volume) src.push(it.volume+(it.issue?`(${it.issue})`:''));
  else if(it.issue) src.push(`(${it.issue})`);
  return `${base}. ${src.filter(Boolean).join(', ')}${it.pages?': '+it.pages:''}.${it.doi?' DOI:'+it.doi+'.':''}`;
}
function apaName(n){
  n=n.trim();
  if(n.includes(',')) return n.replace(/\s*,\s*/g,', ');
  const p=n.split(/\s+/);
  if(p.length>1){ const last=p.pop(); return last+', '+p.map(x=>x[0].toUpperCase()+'.').join(' ') }
  return n;
}
function apa(it){
  const a=names(it.authors).map(apaName);
  let au=a.length===1? a[0] : (a.length? a.slice(0,-1).join(', ')+', & '+a[a.length-1] : '佚名');
  return `${au} (${nz(it.year,'n.d.')}). ${nz(it.title)}. ${nz(it.journal,nz(it.publisher))}${it.volume?', '+it.volume:''}${it.issue?`(${it.issue})`:''}${it.pages?', '+it.pages:''}.${it.doi?' https://doi.org/'+it.doi:''}`;
}
function vanc(it){
  const a=names(it.authors); const au=(a.length>6? a.slice(0,6).join(', ')+', et al' : a.join(', '));
  const src=[nz(it.journal,nz(it.publisher)),nz(it.year)];
  let v=nz(it.year);
  if(it.volume) v+=';'+it.volume+(it.issue?`(${it.issue})`:'');
  else if(it.issue) v+=';('+it.issue+')';
  return `${au}. ${nz(it.title)}. ${nz(it.journal,nz(it.publisher))}. ${v}${it.pages?':'+it.pages:''}.${it.doi?' doi:'+it.doi+'.':''}`;
}
function initials(n){
  const p=n.split(/\s+/);
  if(p.length<2) return n;
  const last=p.pop();
  return p.map(x=>x[0].toUpperCase()+'.').join(' ')+' '+last;
}
function ieeeNum(it,n){
  const au=names(it.authors).map(initials);
  const a=au.length===1? au[0] : au.length? au.slice(0,-1).join(', ')+' and '+au[au.length-1] : 'Anon.';
  return `[${n}] ${a}, "${nz(it.title)}," ${nz(it.journal,nz(it.publisher))}${it.volume?', vol. '+it.volume:''}${it.issue?', no. '+it.issue:''}${it.pages?', pp. '+it.pages:''}${it.year?', '+it.year:''}.`;
}
function mla(it){
  const a=names(it.authors);
  const au=a.length===1? a[0] : a.length>1? a[0]+', et al.' : '佚名';
  return `${au} "${nz(it.title)}." ${nz(it.journal,nz(it.publisher))}${it.volume?', vol. '+it.volume:''}${it.issue?', no. '+it.issue:''}${it.year?', '+it.year:''}${it.pages?', pp. '+it.pages:''}.`;
}
function chi(it){
  const a=names(it.authors).map(apaName);
  const au=a.length? a.slice(0,-1).join(', ')+(a.length>1?', and ':'')+a[a.length-1] : '佚名';
  return `${au}. "${nz(it.title)}." ${nz(it.journal,nz(it.publisher))}${it.volume?' '+it.volume:''}${it.issue?' no. '+it.issue:''} (${nz(it.year)})${it.pages?': '+it.pages:''}.`;
}
function fmt(it,index){
  switch(state.style){
    case 'gb': return gb(it);
    case 'apa': return apa(it);
    case 'vanc': return vanc(it);
    case 'ieee': return ieeeNum(it,index+1);
    case 'mla': return mla(it);
    case 'chi': return chi(it);
    default: return gb(it);
  }
}

      <span class="hint">库里有 <b>${DB.items.filter(i=>i.tags.includes('示例数据')).length}</b> 条示例数据，用于试功能；不想要可以一键删掉。</span>
      <button class="mini" onclick="clearSamples()">删除示例数据</button></div>`:''}
      <div id="selBar" class="hint" style="margin-bottom:8px"></div><div id="libList"></div></div>
  </div>`;
  refreshList();
}
function smartGroupsHtml(){
  const cnt=(fn)=>{const m=new Map();DB.items.forEach(it=>{const v=fn(it)||'';if(v) m.set(v,(m.get(v)||0)+1)});return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,7)};
  const years=cnt(it=>it.year), jn=cnt(it=>it.journal||it.publisher), tg=cnt(it=>it.tags[0]);
  const block=(title,list,kind)=>`<h4>${title}</h4>`+list.map(([v,n])=>`<div class="gl" onclick="pick('${kind}','${encodeURIComponent(v)}')"><span>${esc(v)}</span><span class="n">${n}</span></div>`).join('')+(list.length?'':'<div class="hint">暂无</div>');
  return block('按年份',years,'year')+block('按期刊 / 出版者',jn,'journal')+block('按标签',tg,'tag')+
  `<h4>操作</h4><div class="gl" onclick="state.tag='';state.folder='';refreshList()"><span>清除所有筛选</span></div>`;
}
function pick(kind,v){
  v=decodeURIComponent(v||'');
  if(kind==='year') { state.search=''; state.tag=''; state.folder=''; state._journal=''; state._year=v; }
  if(kind==='journal') { state._year=''; state.tag=''; state._journal=v; }
  if(kind==='tag') { state.tag=v; state._year=''; state._journal=''; }
  refreshList();
}
function filteredItems(){
  let list=DB.items.slice();
  if(state.folder) list=list.filter(i=>i.folders.includes(state.folder));
  if(state.tag) list=list.filter(i=>i.tags.includes(state.tag));
  if(state._year) list=list.filter(i=>String(i.year)===String(state._year));
  if(state._journal) list=list.filter(i=>(i.journal||i.publisher)===state._journal);
  if(state.onlyCheck) list=list.filter(i=>confidence(i)<60);
  let scored=null;
  if(state.search.trim()){
    if(state.mode==='sem'){ scored=semanticScores(state.search); list=list.filter(i=>scored.get(i.id)>0.05); }
    else { list=list.filter(i=>kwMatch(i,state.search)); }
  }
  const s=state.sort;
  if(state.mode==='sem'&&scored&&state.search.trim()) list.sort((a,b)=>scored.get(b.id)-scored.get(a.id));
  else if(s==='year'||s==='yeardesc') list.sort((a,b)=>(parseInt(b.year)||0)-(parseInt(a.year)||0));
  else if(s==='title') list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','zh'));
  else if(s==='conf') list.sort((a,b)=>confidence(a)-confidence(b));
  else list.sort((a,b)=>b.added-a.added);
  return {list,scored};
}
function refreshList(){
  const {list,scored}=filteredItems();
  $('#smartGroups').innerHTML=smartGroupsHtml();
  const chips=[];
  if(state.tag) chips.push(`标签：${state.tag}`);
  if(state._year) chips.push(`年份：${state._year}`);
  if(state._journal) chips.push(`期刊：${state._journal}`);
  $('#selBar').innerHTML=(list.length?`筛选结果 <b>${list.length}</b> 条`+(state.mode==='sem'&&state.search?'（按语义相似度排序）':''):'')+
    (chips.length? ' · '+(chips.map(c=>`<span class="chip acc">${esc(c)} ×</span>`).join(' '))+' <a href="javascript:void(0)" onclick="clearSmart()" style="color:#12507a">清除</a>':'');
  $('#libList').innerHTML= list.length? list.map(it=>{
    const cf=confidence(it);
    const tags=it.tags.slice(0,3).map(t=>`<span class="chip tag">${esc(t)}</span>`).join('');
    const sim=scored&&scored.get(it.id)!=null?`<span class="chip acc">相关 ${Math.round(scored.get(it.id)*100)}%</span>`:'';
    const cn=it.notes.length;
    return `<div class="itm ${state.sel.has(it.id)?'sel':''}" id="itm-${it.id}" onclick="openDetail('${it.id}')">
      <input type="checkbox" class="selbox" ${state.sel.has(it.id)?'checked':''} onclick="event.stopPropagation()" onchange="toggleSel('${it.id}',this.checked)">
      <div class="tl">${esc(it.title||'（未命名题录）')}</div>
      <div class="mt">${esc(gbAuthors(it.authors))} · ${esc(it.journal||it.publisher||'—')} · ${esc(it.year||'—')}${it.pages?' · '+esc(it.pages):''}</div>
      <div style="margin-top:7px">
        <span class="chip">${esc(it.type)}</span>
        ${it.doi?`<span class="chip ok" title="点一下去熊猫学术检索这篇" onclick="event.stopPropagation();openPanda('${esc(it.doi)}')">DOI ↗</span>`:''}
        ${cf<60?'<span class="chip warn">待校对 '+cf+'</span>':''}
        ${cn?'<span class="chip">笔记 '+cn+'</span>':''}
        ${it.attachments.length?'<span class="chip">PDF '+it.attachments.length+'</span>':''}
        ${sim}${tags}
      </div>
    </div>`;
  }).join('') : `<div class="blank">没有匹配的文献。试试清空筛选，或点「新建题录」「导入题录」。</div>`;
}
function clearSmart(){ state.tag=''; state._year=''; state._journal=''; state.folder=''; refreshList() }
function clearSamples(){

function toggleSel(id,on){

function selAll(){

  const all=list.every(i=>state.sel.has(i.id));

function gbSingle(id){ const it=DB.items.find(i=>i.id===id); return it? gb(it):'' }
function setField(k,v){
  const it=DB.items.find(i=>i.id===state.cur); if(!it) return;
  const before=Array.isArray(it[k])? it[k].join('; ') : String(it[k]==null?'':it[k]);
  const after=Array.isArray(v)? v.join('; ') : String(v);
  if(before===after) return;
  it[k]=v; it.updated=now();
  it.history.push({id:uid(),ts:now(),field:k,before,after});
  save(); toast('已保存：'+k);
  if(state.view==='library') refreshList();
  renderDrawer();
}
function revert(hid){
  const it=DB.items.find(i=>i.id===state.cur); const h=it.history.find(x=>x.id===hid); if(!h) return;
  const field=h.field;
  const val=h.before;
  it[field]=['authors','keywords','tags'].includes(field)? String(val).split(/[;；,，]/).map(s=>s.trim()).filter(Boolean):val;
  it.history.push({id:uid(),ts:now(),field,before:h.after,after:val});
  save(); renderDrawer(); refreshList(); toast('已回退');
}
function toggleFolder(fid){
  const it=DB.items.find(i=>i.id===state.cur);
  const i=it.folders.indexOf(fid); i<0? it.folders.push(fid): it.folders.splice(i,1);
  save(); renderDrawer(); refreshList();
}
function addFolder(){
  const n=prompt('新文件夹名称'); if(!n) return;
  DB.folders.push({id:uid(),name:n.trim()}); save(); renderDrawer(); refreshList();
}
function addNote(){
  const it=DB.items.find(i=>i.id===state.cur);
  const t=$('#nText').value.trim(), q=$('#nQuote').value.trim(), p=$('#nPage').value.trim();
  if(!t&&!q) return toast('写点内容再保存');
  it.notes.push({id:uid(),page:p,quoted:q,text:t,author:DB.author,ts:now()});
  save(); renderDrawer(); toast('批注已保存');
}
function delNote(nid){
  const it=DB.items.find(i=>i.id===state.cur);
  snapshot('删除批注前');
  it.notes=it.notes.filter(n=>n.id!==nid); save(); renderDrawer(); toast('已删除（可在快照恢复）');
}
function quoteNote(nid){
  const it=DB.items.find(i=>i.id===state.cur); const n=it.notes.find(x=>x.id===nid);
  copyText(`「${n.quoted||n.text}」（${it.authors[0]||''} ${it.year||''}，第 ${n.page||'?'} 页）`);

function addDisc(){
  const it=DB.items.find(i=>i.id===state.cur);

}
function delItem(id){
  if(!confirm('删除这条题录？删除前会自动做一次快照，可在「体检与迁移」里恢复。')) return;
  snapshot('删除题录'); DB.items=DB.items.filter(i=>i.id!==id); DB.sel&&state.sel.delete(id);

/* ============ 附件 ============ */
function pickPdf(){ $('#fPdf').value=''; $('#fPdf').click() }
async function openAtt(aid){
  const it=DB.items.find(i=>i.id===state.cur); const a=(it.attachments||[]).find(x=>x.id===aid);
  if(!a) return;
  try{
    const blob=await getBlob(aid);
    if(!blob) return toast(a.persist===false?'这个文件只在本次会话里可用，重开页面后请重新上传':'文件已丢失，请重新添加');
    window.open(URL.createObjectURL(blob),'_blank');
  }catch(e){ toast('打不开：'+e.message) }
}
function openFirstPdf(){
  const it=DB.items.find(i=>i.id===state.cur);
  if(!it.attachments.length) return toast('先添加 PDF');
  openAtt(it.attachments[0].id);
}
function delAtt(aid){
  const it=DB.items.find(i=>i.id===state.cur);
  it.attachments=it.attachments.filter(a=>a.id!==aid); save(); renderDrawer();
}
$('#fPdf').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  const it=DB.items.find(i=>i.id===state.cur);
  const aid=uid();
  const saved=await putBlob(aid,f);
  it.attachments.push({id:aid,name:f.name,size:f.size,ts:now(),persist:saved});
  save(); refreshCurrent();
  toast(saved?('已添加 '+f.name):('已添加 '+f.name+'（暂存内存，重开需重传）'));
});
function refreshCurrent(){
  if(!$('#drawer').classList.contains('hidden')) renderDrawer();
}

function doiDialog(){
  openDialog(`<h3 style="margin:0 0 6px">按 DOI / 标题抓取题录</h3>
  <div class="hint">联网时从 Crossref 取官方元数据（标题、作者、期刊、卷期页码）。离线时会明确提示失败，不会伪造数据。</div>
  <div class="fm" style="grid-template-columns:70px 1fr;margin-top:12px">
    <label>DOI</label><input id="doiIn" placeholder="10.11804/NuclPhysRev.40.02.112">
  </div>
  <div style="margin-top:14px;display:flex;gap:8px"><button class="primary" onclick="doiPull()">抓取并加入文献库</button><button onclick="closeDialog()">取消</button></div>`);
}
async function doiPull(){
  const d=$('#doiIn').value.trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i,'');
  if(!d) return;
  const btn=event.target; btn.disabled=true; btn.textContent='抓取中…';
  try{
    const j=await fetchJSON('https://api.crossref.org/works/'+encodeURIComponent(d));
    const it=crossrefToItem(j.message);
    DB.items.unshift(it); save(); closeDialog(); state.cur=it.id; render(); openDetail(it.id);
    toast('已抓取：'+ (it.title||d));
  }catch(e){
    toast('抓取失败：'+e.message);

/* 带超时与错误翻译的 JSON 请求（限速 + 网络抖动自动重试） */
let _lastCrossref=0;
async function fetchJSON(url,opt,ms){
  const limit=ms||10000;
  if(/crossref\.org/.test(url)){
    const gap=400-(Date.now()-_lastCrossref);
    if(gap>0) await new Promise(r=>setTimeout(r,gap));
    _lastCrossref=Date.now();
  }
  async function once(){
    const ac=new AbortController();
    const id=setTimeout(()=>ac.abort(),limit);
    try{
      const r=await fetch(url,Object.assign({},opt||{},{signal:ac.signal}));
      const txt=await r.text();
      if(!r.ok) throw new Error('HTTP '+r.status+(r.status===404?'（该 DOI 在 Crossref 里查不到）':''));
      try{ return JSON.parse(txt) }
      catch(e){ throw new Error('返回的不是有效元数据（该 DOI 可能未在 Crossref 注册）') }
    }finally{ clearTimeout(id) }
  }
  let lastErr=null;
  for(let i=0;i<3;i++){
    try{ return await once() }
    catch(e){
      lastErr=e;
      if(e.name==='AbortError') throw new Error('请求超时，检查网络或代理后重试');
      const net=/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(String(e.message||''));
      if(!net) throw e;
      _lastCrossref=0;
      await new Promise(r=>setTimeout(r,600*(i+1)));
    }
  }
  throw new Error('网络请求失败（'+(lastErr&&lastErr.message||'')+'），检查网络或代理后重试');
}
function crossrefToItem(m){
  const it=blankItem();
  it.title=(m.title&&m.title[0])||'';
  it.authors=(m.author||[]).map(a=>[a.given,a.family].filter(Boolean).join(' ')||a.name||'').filter(Boolean);
  const yr=(m.issued&&m.issued['date-parts']&&m.issued['date-parts'][0][0])||'';
  it.year=String(yr||'');
  it.journal=(m['container-title']&&m['container-title'][0])||'';
  it.volume=m.volume||''; it.issue=m.issue||''; it.pages=m.page||'';
  it.doi=m.DOI||''; it.url=m.URL||'';
  it.abstract=(m.abstract||'').replace(/<[^>]+>/g,'');
  it.type=/proceedings/i.test(m.type||'')?'会议论文':/book/i.test(m.type||'')?'专著':'期刊论文';
  return it;
}
async function crossrefOne(id){
  const it=DB.items.find(i=>i.id===id); const doi=(it.doi||'').trim();

/* ============ 导入：RIS / BibTeX ============ */
$('#fImport').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) readImport(f) });
function readImport(file){
  const fr=new FileReader();
  fr.onload=()=>{
    const txt=String(fr.result||'');
    let added=0;
    try{
      if(/\.bib$/i.test(file.name)||txt.trim().startsWith('@')) added=importBib(txt);
      else if(/\.json$/i.test(file.name)) added=importJson(txt);
      else added=importRis(txt);
    }catch(err){ return toast('解析失败：'+err.message) }
    if(added){ save(); snapshot('导入前'); render(); toast(`导入 ${added} 条题录`); }
    else toast('没有识别到可导入的题录');
  };
  fr.readAsText(file,'utf-8');
}
function importRis(txt){
  const recs=txt.split(/\n(?=TY  -)/).map(s=>s.trim()).filter(Boolean);
  let n=0;
  recs.forEach(rec=>{
    const it=blankItem(); let ty='';
    rec.split(/\r?\n/).forEach(line=>{
      const m=line.match(/^([A-Z][A-Z0-9])  - (.*)$/); if(!m) return;
      const [,tag,val]=m;
      if(tag==='TY') ty=val.trim();
      else if(tag==='TI'||tag==='T1') it.title=val.trim();
      else if(tag==='AU'||tag==='A1') it.authors.push(val.trim());
      else if(tag==='PY'||tag==='Y1') it.year=val.trim().slice(0,4);
      else if(tag==='JO'||tag==='T2'||tag==='JF') it.journal=val.trim();
      else if(tag==='VL') it.volume=val.trim();
      else if(tag==='IS') it.issue=val.trim();
      else if(tag==='SP') it.pages=val.trim();
      else if(tag==='EP') it.pages=(it.pages?it.pages+'-':'')+val.trim();
      else if(tag==='DO') it.doi=val.trim();
      else if(tag==='AB'||tag==='N2') it.abstract=val.trim();
      else if(tag==='KW') it.keywords.push(val.trim());
      else if(tag==='PB') it.publisher=val.trim();
      else if(tag==='CY') it.place=val.trim();
      else if(tag==='UR') it.url=val.trim();
      else if(tag==='N1'||tag==='AN') it.notes.push({id:uid(),page:'',quoted:'',text:val.trim(),author:'导入',ts:now()});
      else if(tag==='ER') return;
    });
    if(!it.title&&!it.authors.length) return;
    it.type={JOUR:'期刊论文',CONF:'会议论文',THES:'学位论文',BOOK:'专著',RPRT:'报告',GEN:'期刊论文'}[ty]||'期刊论文';
    it.tags=['导入']; DB.items.unshift(it); n++;
  });
  return n;
}
function importBib(txt){
  const entries=[];
  const re=/@([a-zA-Z]+)\s*\{([^,]*),([\s\S]*?)\n\}/g;
  let m; while((m=re.exec(txt))!==null) entries.push({type:m[1].toLowerCase(),key:m[2],body:m[3]});
  let n=0;
  entries.forEach(en=>{
    const fields={};
    const fre=/([a-zA-Z\-_]+)\s*=\s*(\{[^{}]*\}|"[^"]*"|[^,]+)/g;
    let f; while((f=fre.exec(en.body))!==null){
      fields[f[1].toLowerCase()]=f[2].replace(/^[{"\s]+|[}"\s,]+$/g,'').replace(/[\r\n]+/g,' ').trim();
    }
    if(!fields.title&&!fields.author) return;
    const it=blankItem();
    it.title=fields.title||'';
    it.authors=(fields.author||'').split(/\s+and\s+/).map(s=>s.trim()).filter(Boolean);
    it.year=(fields.year||fields.date||'').slice(0,4);
    it.journal=fields.journal||fields.booktitle||fields.publisher||'';
    it.volume=fields.volume||''; it.issue=fields.number||''; it.pages=fields.pages||'';
    it.doi=fields.doi||''; it.abstract=fields.abstract||''; it.url=fields.url||'';
    it.keywords=(fields.keywords||'').split(/[;,]/).map(s=>s.trim()).filter(Boolean);
    it.type=en.type==='article'?'期刊论文':en.type==='inproceedings'?'会议论文':en.type==='phdthesis'||en.type==='mastersthesis'?'学位论文':en.type==='book'?'专著':'期刊论文';
    const ann=fields.annote||fields.note;
    if(ann) it.notes.push({id:uid(),page:'',quoted:'',text:ann,author:'导入',ts:now()});
    it.tags=['导入']; DB.items.unshift(it); n++;
  });
  return n;
}
function importJson(txt){
  const j=JSON.parse(txt);
  const arr=Array.isArray(j)? j : (j.items||[]);
  let n=0;
  arr.forEach(x=>{ DB.items.unshift(normalizeItem(x)); n++ });
  return n;
}

function dupDialog(){
  const g=new Map();
  DB.items.forEach(it=>{ const k=dupKey(it); if(!g.has(k)) g.set(k,[]); g.get(k).push(it) });
  const groups=[...g.values()].filter(v=>v.length>1);
  openDialog(`<h3 style="margin:0 0 6px">查重结果</h3>
    <div class="hint">按 DOI（优先）或规范化标题 + 年份判断；同一文献的预印本与正式版会提示，可选是否合并。</div>
    ${groups.length? groups.map((v,i)=>`<div class="card" style="margin-top:12px">
      <div class="hint">疑似同一文献 · ${v.length} 条</div>
      ${v.map(it=>`<div class="list-row"><span><b>${esc(it.title)}</b><br><span class="hint">${esc(it.journal||it.publisher||'')} ${esc(it.year||'')} · 置信度 ${confidence(it)}</span></span></div>`).join('')}
      <div style="margin-top:8px"><button class="mini primary" onclick="mergeGroup(${i})">合并为一条（保留全部标签与批注）</button></div>
    </div>`).join(''):'<div class="blank">没有发现重复题录</div>'}
    <div style="margin-top:16px"><button onclick="closeDialog()">关闭</button></div>`);
  window._dups=groups;
}
function mergeGroup(i){
  snapshot('合并前');
  const v=window._dups[i]; const keep=v[0]; const drop=v.slice(1);
  drop.forEach(d=>{
    keep.tags=[...new Set([...keep.tags,...d.tags])];
    keep.keywords=[...new Set([...keep.keywords,...d.keywords])];
    keep.folders=[...new Set([...keep.folders,...d.folders])];
    keep.notes=keep.notes.concat(d.notes);
    keep.discussions=keep.discussions.concat(d.discussions);
    keep.attachments=keep.attachments.concat(d.attachments);
    ['title','journal','volume','issue','pages','doi','abstract','publisher','place','year'].forEach(k=>{ if(!keep[k]&&d[k]) keep[k]=d[k] });
    if(keep.authors.length<d.authors.length) keep.authors=d.authors;
  });
  DB.items=DB.items.filter(x=>!drop.some(d=>d.id===x.id));
  save(); closeDialog(); render(); toast('已合并，附件与批注已保留');
}

function exportRis(){

    L.push('TY  - '+ty);

function renderMigBox(){
  const it=DB.items[0]||{};
  const fields=['title','authors','year','journal','volume','issue','pages','doi','abstract','keywords','tags','folders','notes','discussions','attachments','history'];
  const okFields=fields.filter(f=>{
    return DB.items.some(x=>{
      const v=x[f]; if(Array.isArray(v)) return v.length>0; return v!=null&&v!=='';
    });
  });
  const missing=fields.filter(f=>!okFields.includes(f));
  $('#migBox').innerHTML=`<div class="hint">导出到其他工具时，以下字段有实际内容（RIS 用 N1 携带批注，BibTeX 用 annote + 自定义字段）：</div>
  <table class="tb" style="margin-top:10px"><tr><th>字段</th><th>本库覆盖</th><th>迁移方式</th></tr>
  ${fields.map(f=>{
    const has=okFields.includes(f);
    const how={notes:'BibTeX annote / RIS N1（含页码与原文摘录）',tags:'BibTeX wenshu_tags / RIS KW 追加',folders:'迁移包 JSON',history:'迁移包 JSON',attachments:'本机 IndexedDB，需随迁移包复制',discussions:'迁移包 JSON'}[f]||'标准字段直出';
    return `<tr><td>${f}</td><td>${has?'<span class="chip ok">有内容</span>':'<span class="chip">多数为空</span>'}</td><td class="hint">${how}</td></tr>`;
  }).join('')}</table>
  <div class="hint" style="margin-top:10px">${missing.length? '尚未使用的字段：'+missing.join('、')+'（不会影响导出，只说明库里还没有这类信息）':'全部字段都有内容，迁移风险低。'}</div>`;
}
async function verifyAll(){
  const list=DB.items.filter(i=>i.doi);
  const log=$('#verifyLog');
  if(!list.length) return toast('没有含 DOI 的条目');
  let ok=0,fail=0;
  for(const it of list){
    try{
      const j=await fetchJSON('https://api.crossref.org/works/'+encodeURIComponent(it.doi));
      const n=crossrefToItem(j.message);
      let changed=[];
      ['title','journal','volume','issue','pages','abstract'].forEach(k=>{ if(!it[k]&&n[k]){ it[k]=n[k]; changed.push(k) } });
      if(!it.year&&n.year){ it.year=n.year; changed.push('year') }
      if((!it.authors.length)&&n.authors.length){ it.authors=n.authors; changed.push('authors') }
      if(changed.length){ it.history.push({id:uid(),ts:now(),field:'批量校验',before:'—',after:'补全 '+changed.join(',')}) }
      ok++;
      log.innerHTML+=`<div>✔ ${esc(it.title.slice(0,28))} —— 补全 ${changed.length?changed.join('/'):'无需改动'}</div>`;
    }catch(e){ fail++; log.innerHTML+=`<div style="color:var(--warn)">✘ ${esc((it.title||'').slice(0,28))} —— 校验失败（离线或 DOI 无效）</div>` }
  }
  save(); toast(`校验完成：成功 ${ok}，失败 ${fail}`); render();
}
function exportConfidence(){
  const rows=[['标题','作者','年份','期刊','DOI','页码','置信度']];
  DB.items.filter(i=>confidence(i)<60).forEach(it=>rows.push([it.title,it.authors.join('; '),it.year,it.journal||'',it.doi,it.pages,confidence(it)]));
  dl('待校对清单.csv','\ufeff'+rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv;charset=utf-8');
  toast('已导出待校对清单');
}
function restoreSnap(sid){
  const s=DB.snapshots.find(x=>x.id===sid); if(!s) return;
  if(!confirm('用这份快照覆盖当前文献库？当前版本会先备份一份快照。')) return;
  snapshot('恢复前自动备份');
  try{ const d=JSON.parse(s.data); DB.items=d.items.map(normalizeItem); DB.folders=d.folders||DB.folders; save(); render(); toast('已恢复到 '+dt(s.ts)) }
  catch(e){ toast('快照损坏，无法恢复') }
}
function previewSnap(sid){
  const s=DB.snapshots.find(x=>x.id===sid);
  try{
    const d=JSON.parse(s.data);
    const cur=new Map(DB.items.map(i=>[i.id,i]));
    const then=new Map(d.items.map(i=>[i.id,i]));
    const added=[...cur.keys()].filter(k=>!then.has(k)).length;
    const removed=[...then.keys()].filter(k=>!cur.has(k)).length;
    openDialog(`<h3 style="margin:0 0 8px">快照差异 · ${dt(s.ts)}</h3>
    <div class="hint">快照条目 ${d.items.length} 条；当前 ${DB.items.length} 条。<br>相对该快照，当前新增 ${added} 条、删除 ${removed} 条。</div>
    <div style="margin-top:14px"><button onclick="closeDialog()">关闭</button></div>`);
  }catch(e){ toast('无法读取快照') }
}

function outlineDraft(){

async function aiDraft(){
  const list=DB.items.filter(i=>i.notes.length||i.abstract);
  if(!list.length) return toast('库里内容太少');
  if(!DB.llm.url) return toast('先在「改进对照 / 设置」里填本地模型地址（如 Ollama）');
  openDialog('<div id="aiOut" class="hint">正在请求本地模型…</div>');
  const ctx=list.slice(0,12).map((it,i)=>`[${i+1}] ${it.title}（${it.authors.join('、')} ${it.year}）摘要：${(it.abstract||'').slice(0,300)} 批注：${it.notes.map(n=>n.text).join('；').slice(0,200)}`).join('\n');
  try{
    const r=await fetch(DB.llm.url.replace(/\/$/,'')+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:DB.llm.model||'qwen2.5:7b',stream:false,
        prompt:`你是科研写作助手。仅基于下列文献信息，写一段 400 字中文综述草稿，每个观点后必须用 [编号] 标注来源，不得编造未提供的结论。\n\n${ctx}`})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    $('#aiOut').innerHTML=`<div class="hint">模型 ${esc(j.model||'')} 输出（来源编号可点「查看原文」核对）：</div>
      <div class="card" style="margin-top:10px;white-space:pre-wrap;font-size:13.5px">${esc(j.response||'（空）')}</div>
      <div class="hint" style="margin-top:10px">来源清单：<br>${list.slice(0,12).map((it,i)=>`[${i+1}] ${esc(it.title)}`).join('<br>')}</div>
      <div style="margin-top:12px"><button onclick="closeDialog()">关闭</button></div>`;
  }catch(e){
    $('#aiOut').innerHTML=`<div style="color:var(--bad)">连接本地模型失败：${esc(e.message)}</div>
    <div class="hint" style="margin-top:8px">检查 Ollama 是否已启动（ollama serve），以及是否允许跨域：设置环境变量 OLLAMA_ORIGINS=* 后重启。不会把全文上传到公网。</div>
    <div style="margin-top:12px"><button onclick="closeDialog()">关闭</button></div>`;
  }
}

function importPack(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const j=JSON.parse(fr.result);
        const items=(Array.isArray(j)?j:(j.items||[])).map(normalizeItem);
        if(!items.length) throw new Error('包里没有题录');
        snapshot('导入迁移包前');
        const exist=new Set(DB.items.map(dupKey));
        let n=0;
        items.forEach(it=>{ if(exist.has(dupKey(it))) return; DB.items.unshift(it); n++ });
        if(j.folders) j.folders.forEach(f2=>{ if(!DB.folders.some(x=>x.name===f2.name)) DB.folders.push(f2) });
        save(); render(); toast(`导入 ${n} 条（其余判定为重复已跳过）`);
      }catch(err){ toast('迁移包解析失败：'+err.message) }
    };
    fr.readAsText(f,'utf-8');
  };
  inp.click();
}

/* 按标题 + 年份在 Crossref 反查 DOI */
function titleScore(a,b){
  const norm=s=>String(s||'').toLowerCase().replace(/[\s\-—_.,:;'"“”‘’()（）\[\]]/g,'');
  const A=norm(a),B=norm(b);
  if(!A||!B) return 0;
  if(A===B) return 1;
  const gram=s=>{const m=new Map();for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);m.set(g,(m.get(g)||0)+1)}return m};
  const ga=gram(A),gb=gram(B);
  let inter=0,na=0,nb=0;
  ga.forEach((v,k)=>{ na+=v; if(gb.has(k)) inter+=Math.min(v,gb.get(k)) });
  gb.forEach(v=>nb+=v);
  return (na+nb)? 2*inter/(na+nb) : 0;
}
let _doiNote='';
async function doiByTitleStr(title,year,authorHint){
  if(!title||title.length<6) return '';
  const q='https://api.crossref.org/works?rows=20&select=DOI,title,issued,type,author&query.title='+encodeURIComponent(title);
  const j=await fetchJSON(q,{headers:{'Accept':'application/json'}},8000);
  const list=(j.message&&j.message.items)||[];
  const cands=list.filter(it=>titleScore(title,(it.title&&it.title[0])||'')>=0.95);
  if(!cands.length) return '';
  const yearsOf=it=>((it.issued&&it.issued['date-parts']&&it.issued['date-parts'][0][0])||0);
  const hintTxt=String(authorHint||'').toLowerCase();
  const authorMatch=it=>{
    if(!hintTxt) return false;
    const fam=(it.author||[]).map(a=>String(a.family||'').toLowerCase()).filter(s=>s.length>2);
    return fam.some(f=>hintTxt.indexOf(f)>=0);
  };
  let pool=cands;
  // ① 先按年份收敛
  if(year){ const p=cands.filter(it=>{ const y=yearsOf(it); return y&&Math.abs(parseInt(year)-y)<=1 }); if(p.length) pool=p }
  // ② 再按第一作者收敛
  if(pool.length>1 && hintTxt){ const p=pool.filter(authorMatch); if(p.length) pool=p }
  // ③ 同年同作者的于期刊论文中挑一个
  if(pool.length>1){ const p=pool.filter(it=>it.type==='journal-article'); if(p.length===1) pool=p }
  if(pool.length!==1){
    _doiNote='有 '+pool.length+' 条同名候选，无法唯一定位，请手动确认 DOI';
    return '';
  }
  return pool[0].DOI||'';
}
async function doiByTitle(){
  const t=$('#igTitle').value.trim(), y=($('#igYear').value||'').trim(), a=$('#igAuth').value;
  if(!t) return toast('先有标题才能反查');
  toast('正在 Crossref 按标题反查 DOI …');
  _doiNote='';
  try{
    const d=await doiByTitleStr(t,y,a);
    if(!d) return toast(_doiNote||'没反查到可靠匹配，可能是这篇没在 Crossref 注册，或标题识别有偏差');
    $('#igDoi').value=d; toast('反查到 DOI：'+d);
    await fillByDoi();
  }catch(e){ toast('反查失败：'+e.message) }
}
async function fillDoiForItem(id){

let _pdfjs=null;
function loadPdfjs(){
  if(_pdfjs) return Promise.resolve(_pdfjs);
  const bases=['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/','https://unpkg.com/pdfjs-dist@3.11.174/build/','https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/'];
  const load=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error('script fail')); document.head.appendChild(s) });
  return (async()=>{
    for(const b of bases){
      try{
        await load(b+'pdf.min.js');
        if(window.pdfjsLib){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=b+'pdf.worker.min.js'; _pdfjs=window.pdfjsLib; return _pdfjs }
      }catch(e){}
    }
    throw new Error('pdf.js 加载失败（可能没联网）。可联网重试，或用手动粘贴正文。');
  })();
}
async function pdfText(file){
  const js=await loadPdfjs();
  const buf=await file.arrayBuffer();
  const doc=await js.getDocument({data:buf}).promise;
  let meta={};
  try{ meta=(await doc.getMetadata()).info||{} }catch(e){}
  const pages=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const tc=await page.getTextContent();
    const lines=[]; let line=''; let lastY=null;
    tc.items.forEach(it=>{
      const y=it.transform[5];
      if(lastY!==null && Math.abs(y-lastY)>2.4){ lines.push(line); line='' }
      line+=it.str; lastY=y;
    });
    if(line.trim()) lines.push(line);
    pages.push('[[page:'+p+']]\n'+lines.map(s=>s.trim()).filter(Boolean).join('\n'));
  }
  return {pages,meta,numPages:doc.numPages};
}
async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined') throw new Error('浏览器不支持解压，请用 Chrome / Edge');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const buf=await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}
async function docxText(file){
  const ab=new Uint8Array(await file.arrayBuffer());
  const dv=new DataView(ab.buffer);
  let eocd=-1;
  for(let i=ab.length-22;i>=Math.max(0,ab.length-65558);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break } }
  if(eocd<0) throw new Error('不是有效的 docx（zip 结构异常）');
  const count=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
  let p=cdOff, xml=null;
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder('utf-8').decode(ab.subarray(p+46,p+46+nlen));
    if(name==='word/document.xml'){
      if(dv.getUint32(lho,true)!==0x04034b50) throw new Error('zip 局部头异常');
      const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
      const start=lho+30+lnlen+lelen;
      const raw=ab.subarray(start,start+csize);
      xml=method===0? raw : await inflateRaw(raw);
      break;
    }
    p+=46+nlen+elen+clen;
  }
  if(!xml) throw new Error('docx 里没找到 word/document.xml');
  let x=new TextDecoder('utf-8').decode(xml);
  x=x.replace(/<w:tab[^>]*\/>/g,' ').replace(/<w:br[^>]*\/>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'');
  x=x.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  return '[[page:1]]\n'+x.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n');
}
function guessMeta(text,filename){
  const t=(text||'').replace(/\r/g,'').replace(/\[\[page:\d+\]\]/g,'\n');
  const head=t.slice(0,2600);
  const g={title:'',authors:'',year:'',doi:'',journal:'',keywords:[],abstract:'',type:'期刊论文',tags:'上传;待分类'};
  const doiTop=(t.slice(0,6000)+'\n'+t.slice(-4000));
  let doiM=null;
  for(const re of [/10\.\d{4,9}\/[^\s"'<>]+/i, /doi\.org\/(10\.\d{4,9}\/[^\s"'<>]+)/i]){
    const m=doiTop.match(re); if(m){ doiM=m; break }
  }
  if(doiM){
    let d=cleanDoi(doiM[0]);
    d=d.replace(/[.,;:)\]}]+$/,'').replace(/\.{2,}$/,'');
    if(isDoi(d)) g.doi=d;
  }
  const ys=(head.match(/(?:19|20)\d{2}/g)||[]).filter(y=>+y>=1900&&+y<=new Date().getFullYear()+1);
  if(ys.length){
    const m=new Map(); ys.forEach(y=>m.set(y,(m.get(y)||0)+1));
    let best=ys[0],cnt=0;
    m.forEach((v,k)=>{ if(v>cnt||(v===cnt&&+k>+best)){ best=k; cnt=v } });
    g.year=best;
  }else{
    const fy=filename.match(/(?:19|20)\d{2}/); if(fy) g.year=fy[0];
  }
  if(/(dissertation|thesis|学位论文|答辩|指导教师|学位授予)/i.test(head)) g.type='学位论文';
  else if(/(proceedings|conference|symposium|会议|研讨会|论文集)/i.test(head.slice(0,1200))) g.type='会议论文';
  else if(/(arxiv|biorxiv|medrxiv|preprint|预印本)/i.test(head.slice(0,1200))) g.type='预印本';
  const skip=/^(摘要|关键词|abstract|keywords|文章编号|收稿日期|中图分类号|文献标识|基金项目|作者简介|doi|引用格式|citation|第\s*\d+\s*卷|vol\.|issn|received|accepted|published|copyright|©)/i;
  const lines=head.split('\n').map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
  const cands=[];
  for(let i=0;i<Math.min(lines.length,16);i++){
    const L=lines[i];
    if(L.length<8||L.length>170) continue;
    if(skip.test(L)) continue;
    if(/^(http|www\.|10\.)/i.test(L)) continue;
    if(/@/.test(L)) continue;
    const parts=L.split(/[,，、]/);
    if(parts.length>=3 && parts.every(x=>x.trim().length<=4)) continue;   // 作者行
    if(/^\d+$/.test(L)) continue;
    const cjk=(L.match(/[\u4e00-\u9fa5]/g)||[]).length;
    const lat=(L.match(/[a-zA-Z]/g)||[]).length;
    if(cjk<4 && lat<10) continue;
    cands.push({i,L});
  }
  const journalLike=L=>/^(physical review|journal of|proceedings of|advances in|ieee|nature|science|arxiv|acta|annals|applied physics|chinese journal)/i.test(L)
    ||/(学报|杂志|期刊|评论|Letters|Review|Journal|Transactions|通报|科学)$/i.test(L.replace(/[（(].*$/,'').trim());
  const pick=cands.find(c=>!journalLike(c.L))||cands[0];
  if(pick){
    g.title=pick.L;
    const nx=lines[pick.i+1]||'';
    if(nx && /^[A-Z\u4e00-\u9fa5][^。.]{0,80}$/.test(nx) && !/@|\d{4}/.test(nx.slice(0,20)) && !skip.test(nx)) g.authors=nx.replace(/[，,、]\s*/g,'; ');
  }
  const jl=lines.slice(0,16).find(L=>/(学报|杂志|期刊|评论|Journal|Review|Letters|Physics|Science|Nature|Proceedings|大学)/.test(L) && L!==g.title && L.length<90);
  if(jl) g.journal=jl;
  const kw=head.match(/(?:关键词|关键字|Keywords|KEY WORDS)\s*[：:]\s*(.+)/i);
  if(kw) g.keywords=kw[1].split(/[;；,，、]/).map(s=>s.trim()).filter(s=>s&&s.length<26).slice(0,10);
  const ab=head.match(/(?:摘\s*要|Abstract)\s*[：:]?\s*([\s\S]{60,900}?)(?:关键词|关键字|Keywords|引\s*言|1\s*[\.、]\s*引言)/i);
  if(ab) g.abstract=ab[1].replace(/\s+/g,' ').trim().slice(0,600);
  g.tags='上传;待分类'+(g.type==='学位论文'?';学位论文':g.type==='会议论文'?';会议':g.type==='预印本'?';预印本':'');
  return g;
}

let _reader={id:null,text:''};
function detectYear(text){
  const head=String(text||'').slice(0,6000);
  const ys=(head.match(/(?:19|20)\d{2}/g)||[]).filter(y=>+y>=1900&&+y<=new Date().getFullYear()+1);
  if(!ys.length) return '';
  const m=new Map(); ys.forEach(y=>m.set(y,(m.get(y)||0)+1));
  let best=ys[0],cnt=0;
  m.forEach((v,k)=>{ if(v>cnt||(v===cnt&&+k>+best)){ best=k; cnt=v } });
  return best;
}

function readerRender(){
  const box=$('#readerBody'); if(!box) return;
  const q=(($('#rq2')||{}).value||'').trim();
  const parts=_reader.text.split(/\[\[page:(\d+)\]\]/);
  let html='';
  for(let i=0;i<parts.length;i++){
    if(i%2===1){ html+=`<div class="pgbadge">第 ${parts[i]} 页</div>`; continue }
    let seg=esc(parts[i]);
    if(q){
      try{
        const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        seg=seg.replace(re,'<mark>$1</mark>');
      }catch(e){}
    }
    html+=`<span>${seg}</span>`;
  }
  box.innerHTML=html;
  if(q&&box.querySelector('mark')) box.querySelector('mark').scrollIntoView({block:'center'});
}
function noteFromSel(){
  const sel=window.getSelection(); const t=(sel&&sel.toString()||'').trim();
  if(!t) return toast('先在正文里选中一段文字');
  const ta=$('#rQuote2'); if(ta) ta.value=t.slice(0,400);
  const box=$('#readerBody');
  const r=sel.getRangeAt?sel.getRangeAt(0):null;
  if(r&&box&&box.contains(r.startContainer)){
    let node=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;
    while(node&&node!==box&&!node.classList.contains('pgbadge')) node=node.previousElementSibling||node.parentElement;
  }
  toast('已填入「摘录」，补上页码再保存');
}
function saveReaderNote(){
  const it=DB.items.find(i=>i.id===_reader.id); if(!it) return toast('文献记录丢了');
  const p=$('#rPage2').value.trim(), q=$('#rQuote2').value.trim(), x=$('#rText2').value.trim();
  if(!q&&!x) return toast('摘录或批注至少填一项');
  it.notes.push({id:uid(),page:p,quoted:q,text:x,author:DB.author,ts:now()});
  save(); toast('已保存批注'); $('#rText2').value=''; $('#rQuote2').value='';
}

async function lookupSource(doi,itemId){
  const d=(doi||'').trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i,'');
  if(!d) return toast('这条没有 DOI，先补一个');
  openDialog(`<h3 style="margin:0 0 8px">正在检索来源…</h3><div class="hint">${esc(d)} · 查询 Crossref</div>`);
  try{
    const j=await fetchJSON('https://api.crossref.org/works/'+encodeURIComponent(d));
    renderSource(j.message,itemId,d);
  }catch(e){
    openDialog(`<h3 style="margin:0 0 8px">检索失败</h3>
      <div class="hint">${esc(e.message)}<br>可能是没联网或该 DOI 不在 Crossref。可以先直接打开 DOI 落地页试试。</div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="primary" onclick="window.open('https://doi.org/${encodeURIComponent(d)}','_blank')">打开 DOI 落地页</button>
        <button onclick="closeDialog()">关闭</button></div>`);
  }
}
function renderSource(m,itemId,d){
  const title=(m.title&&m.title[0])||'';
  const journal=(m['container-title']&&m['container-title'][0])||'';
  const authors=(m.author||[]).map(a=>[a.given,a.family].filter(Boolean).join(' ')).filter(Boolean).join('; ');
  const year=(m.issued&&m.issued['date-parts']&&m.issued['date-parts'][0][0])||'';
  const links=[];
  links.push(['DOI 落地页（跳出版社原文）','https://doi.org/'+encodeURIComponent(d)]);
  if(m.URL) links.push(['出版社 / 期刊官方页面',m.URL]);
  (m.link||[]).forEach(l=>{ if(l.URL) links.push([(l['content-type']||'').includes('pdf')?'全文 PDF':'全文链接',l.URL]) });
  links.push(['Crossref 记录',`https://api.crossref.org/works/${encodeURIComponent(d)}`]);
  openDialog(`<h3 style="margin:0 0 4px">来源已找到</h3>
  <div class="hint" style="margin-bottom:12px">${esc(title)}</div>
  <div class="srcgrid">
    <div class="k">来源期刊 / 会议</div><div>${esc(journal||'—')}</div>
    <div class="k">出版社</div><div>${esc(m.publisher||'—')}</div>
    <div class="k">ISSN / ISBN</div><div>${esc((m.ISSN||[]).join(', ') || (Array.isArray(m.ISBN)?m.ISBN.join(', '):'') || '—')}</div>
    <div class="k">出版年</div><div>${esc(String(year||'—'))}</div>
    <div class="k">卷 / 期 / 页</div><div>${esc([m.volume,m.issue,m.page].filter(Boolean).join(' / ')||'—')}</div>
    <div class="k">类型</div><div>${esc(m.type||'—')}</div>
    <div class="k">被引次数</div><div>${esc(String(m['is-referenced-by-count']||0))}</div>
    <div class="k">作者</div><div>${esc(authors||'—')}</div>
  </div>
  <div class="sec"><h3>去原文</h3>
    ${links.map(([t,u])=>`<div class="list-row"><span>${esc(t)}<br><span class="hint" style="word-break:break-all">${esc(u)}</span></span>
      <button class="mini primary" onclick="window.open('${esc(u)}','_blank')">打开</button></div>`).join('')}
  </div>
  <div style="margin-top:14px;display:flex;gap:8px">
    ${itemId?`<button class="primary" onclick="applySource('${itemId}')">把这套来源写回题录</button>`:''}
    <button onclick="window.open('https://doi.org/${encodeURIComponent(d)}','_blank')">跳转原文</button>
    <button onclick="closeDialog()">关闭</button>
  </div>
  <div class="hint" style="margin-top:10px">数据来自 Crossref 官方元数据；打不开时多半是出版社放在付费墙后面，但落地页一定对应该文。</div>`);
  window._src={m,d};
}
function applySource(itemId){
  const it=DB.items.find(i=>i.id===itemId); const m=window._src&&window._src.m; if(!it||!m) return;
  snapshot('写回来源前');
  const j=(m['container-title']&&m['container-title'][0])||'';
  if(j) it.journal=j;
  if(m.publisher) it.publisher=m.publisher;
  if(m.volume) it.volume=m.volume;
  if(m.issue) it.issue=m.issue;
  if(m.page) it.pages=m.page;
  const y=(m.issued&&m.issued['date-parts']&&m.issued['date-parts'][0][0])||'';
  if(y) it.year=String(y);
  if(m.URL) it.url=m.URL;
  it.citations=String(m['is-referenced-by-count']||'');
  it.updated=now(); save(); closeDialog(); render(); toast('来源信息已写回题录');
}

async function sha256(str){
  try{
    const buf=new TextEncoder().encode(str);
    const h=await crypto.subtle.digest('SHA-256',buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=2166136261; const s=String(str);
    for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619) }
    return 'fnv'+(h>>>0).toString(16);
  }
}

  cv.width=W*dpr; cv.height=H*dpr;

}
function wxTick(ts){
  if(!WX.run) return;
  const dt=Math.min(.045,Math.max(.001,(ts-WX.last)/1000)); WX.last=ts;
  const c=WX.ctx, W=WX.W, H=WX.H;
  if(!c) return;
  c.clearRect(0,0,W,H);
  if(WX.mode==='rain') wxDrawRain(c,dt,W,H);
  else if(WX.mode==='snow') wxDrawSnow(c,dt,W,H);
  WX.raf=requestAnimationFrame(wxTick);
}
function wxDrawRain(c,dt,W,H){
  const g=WX.ground;
  const grd=c.createLinearGradient(0,g-50,0,H);
  grd.addColorStop(0,'rgba(140,180,215,0)');
  grd.addColorStop(1,'rgba(150,195,225,.20)');
  c.fillStyle=grd; c.fillRect(0,g-50,W,H-g+50);
  for(const p of WX.parts){
    p.y+=p.v*dt; p.x+=36*dt;
    if(p.y>g){
      if(Math.random()<.6) WX.ripples.push({x:p.x,y:g+Math.random()*14,r:2,max:16+Math.random()*26,a:.45+Math.random()*.25});
      if(Math.random()<.5){ for(let k=0;k<3;k++) WX.splashes.push({x:p.x,y:g-2,vx:(Math.random()-.5)*52,vy:-14-Math.random()*36,life:0,a:.5}) }
      p.y=-p.l-Math.random()*60; p.x=Math.random()*W-40;
    }
    if(p.x>W+30) p.x=-30;
    c.strokeStyle='rgba(200,228,246,'+p.a+')';
    c.lineWidth=.8+ (p.a*1.6);
    c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x-7,p.y-p.l); c.stroke();
  }
  for(let i=WX.ripples.length-1;i>=0;i--){
    const r=WX.ripples[i]; r.r+=36*dt; r.a-=.85*dt;
    if(r.r>r.max||r.a<=0){ WX.ripples.splice(i,1); continue }
    c.strokeStyle='rgba(208,233,248,'+Math.max(0,r.a)+')'; c.lineWidth=1.3;
    c.beginPath(); c.ellipse(r.x,r.y,r.r,r.r*.30,0,0,Math.PI*2); c.stroke();
  }
  for(let i=WX.splashes.length-1;i>=0;i--){
    const s=WX.splashes[i]; s.life+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=150*dt;
    if(s.life>.55){ WX.splashes.splice(i,1); continue }
    c.strokeStyle='rgba(220,240,252,'+(s.a*(1-s.life/.55))+')'; c.lineWidth=1.1;
    c.beginPath(); c.moveTo(s.x,s.y); c.lineTo(s.x+2,s.y-3.2); c.stroke();
  }
}
function wxDrawSnow(c,dt,W,H){
  const g=WX.ground;
  const grd=c.createLinearGradient(0,g-30,0,H);
  grd.addColorStop(0,'rgba(240,248,255,0)');
  grd.addColorStop(1,'rgba(240,248,255,.22)');
  c.fillStyle=grd; c.fillRect(0,g-30,W,H-g+30);

  }
}

function solarTermDay(y,n){

function cnNum(v){
  if(!v) return NaN;
  const z='正一二三四五六七八九十'.split('');
  if(/^\d+$/.test(v)) return parseInt(v,10);
  v=v.replace(/月|日/g,'');
  if(v==='十一') return 11; if(v==='十二') return 12;
  if(v.length===2&&v[0]==='十') return 10+z.indexOf(v[1]);
  if(v.length===2&&v[1]==='十') return z.indexOf(v[0])*10;
  return z.indexOf(v);
}
function lunarMD(d){
  try{
    const p=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{month:'numeric',day:'numeric'}).formatToParts(d);
    const m=p.find(x=>x.type==='month'), dd=p.find(x=>x.type==='day');
    return {m:cnNum(m&&m.value),d:cnNum(dd&&dd.value)};
  }catch(e){ return {m:0,d:0} }
}

    if(fx){ const f=TERM_FX[fx]||{e:'✨',h:fx}; return {on:fx,e:f.e,h:f.h} }
  }catch(e){}
  const now=new Date(), y=now.getFullYear();
  for(let i=0;i<24;i++){
    if(sameDay(solarTermDay(y,i),now)){ const n=TERM_NAMES[i],fx=TERM_FX[n]||{e:'🌿',h:n}; return {on:n,e:fx.e,h:fx.h} }
  }
  const lm=lunarMD(now), nx=lunarMD(new Date(now.getTime()+86400000));
  for(const f of FESTIVALS){
    if(lm.m===f.l[0]&&lm.d===f.l[1]) return {on:f.tag,e:f.e,h:f.h}
  }
  if(lm.m===12&&nx.m===1&&nx.d===1) return {on:'除夕',e:'🧨',h:'除夕 · 爆竹声中一岁除'};
  return null;
}
function seasonSpawn(x,y,big){
  const g=$('#gate'); if(!g||!SEASON.on) return;
  const s=document.createElement('span');
  s.className='wxt';
  s.style.left=x+'px'; s.style.top=y+'px';
  s.style.fontSize=(big?34:24+Math.random()*8)+'px';
  s.textContent=SEASON.e;
  if(/饺子|汤圆|粥|粽|包子/.test(SEASON.h)||SEASON.e==='🥟'){
    for(let i=0;i<3;i++){ const st=document.createElement('div'); st.className='steam'+(i?' s'+(i+1):''); s.appendChild(st) }
  }
  g.appendChild(s);
  setTimeout(()=>s.remove(),2500);
}
function seasonBurst(x,y,n){
  for(let i=0;i<n;i++){
    const dx=(Math.random()-.5)*70, dy=(Math.random()-.5)*54;
    setTimeout(()=>seasonSpawn(x+dx,y+dy,false),i*70);
  }
}
function seasonInit(){
  const s=seasonFind();
  const badge=$('#wxSeason');
  if(!s){ SEASON.on=null; if(badge) badge.style.display='none'; return }
  SEASON.on=s.on; SEASON.e=s.e; SEASON.h=s.h;
  if(badge){ badge.style.display='inline-block'; badge.textContent=s.h+' · 鼠标划一划' }
  const g=$('#gate'); if(!g||g.dataset.fxOn) return;
  g.dataset.fxOn='1';
  let lock=0;
  g.addEventListener('mousemove',e=>{
    if(!SEASON.on||$('#gate').classList.contains('hidden'))return;
    const t=Date.now(); if(t-lock<140) return; lock=t;
    seasonSpawn(e.clientX,e.clientY,false);
  });
  g.addEventListener('click',e=>{
    if(!SEASON.on||$('#gate').classList.contains('hidden'))return;
    if(e.target.closest('.gate-card')) return;
    seasonBurst(e.clientX,e.clientY,5);
  });
  /* 节气当天一进来先冒一小把，提示有这个彩蛋 */
  setTimeout(()=>{
    if(!SEASON.on)return;
    seasonBurst(innerWidth*0.5,innerHeight*0.52,3);
    setTimeout(()=>seasonBurst(innerWidth*0.28,innerHeight*0.4,3),900);
  },1600);
}

function wxInit(){
  if(WX.inited) return; WX.inited=true;
  const house=$('#wxHouse');
  if(house) house.addEventListener('click',()=>house.classList.toggle('open'));
  const sw=$('#wxSwitch');
  if(sw) sw.addEventListener('click',e=>{
    const b=e.target.closest('button[data-wxmode]'); if(!b) return;
    const m=b.dataset.wxmode; WX.pref=m;
    try{ localStorage.setItem(WX_KEY,m) }catch(err){}
    if(m==='auto') wxFetchWeather(); else wxSetMode(m,{manual:true});
  });
  try{ WX.pref=localStorage.getItem(WX_KEY)||'auto' }catch(e){ WX.pref='auto' }
  try{ const q=new URLSearchParams(location.search).get('wx'); if(q&&WX_LABEL[q]) WX.pref=q }catch(e){}
  if(!WX_LABEL[WX.pref]) WX.pref='auto';
  wxStart();
  if(WX.pref==='auto') wxFetchWeather(); else wxSetMode(WX.pref,{manual:true});
  let rt=0;
  window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(wxResize,150) });
}
function wxEnter(){
  wxInit();
  bgStart();
  seasonInit();
  if(!WX.run) wxStart();
  if(WX.pref==='auto') wxFetchWeather(); else wxSetMode(WX.pref,{manual:true});
}

(async function boot(){
  await ensureAccounts();
  if(CLOUD.mode==='gist'){
    GH.tok=localStorage.getItem('wenshu.ghtok')||ghEmbed();
  }
  const ses=readSession();
  if(ses && ses.remember && now()-ses.ts < 30*86400000){
    currentUser=ses.u;
    if(CLOUD.on){
      const k=await restoreKey(ses.u);
      if(k){
        CLOUD.user=ses.u; CLOUD.key=k;
        try{
          const pack=await cloudGet(ses.u);
          if(pack){ await cloudApply(await cloudDecrypt(k,pack)); cloudChip('已从云端载入 '+DB.items.length+' 条','ok') }
        }catch(e){}
      }
    }
    startApp(); scheduleCloud();
  }else{
    $('#gate').classList.remove('hidden');
    wxEnter();
  }
})();

window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeDrawer(); closeDialog() }
  if((e.ctrlKey||e.metaKey)&&e.key==='s' && currentUser){ e.preventDefault(); exportMigration() }
});
// 支持把 .ris/.bib 拖进窗口导入
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{
  e.preventDefault();
  if(!currentUser) return;
  const f=e.dataTransfer.files[0];
  if(!f) return;
  if(/\.(pdf|docx|txt|md)$/i.test(f.name)) { ingestFiles([f]); return }
  readImport(f);
});
